<title>Coverage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F1F3F6; --card:#FFFFFF; --sunk:#E8ECF1; --hover:#EDF1F5;
  --ink:#0E1520; --muted:#54626F; --faint:#7C8896;
  --rule:#D3DAE3; --rule-soft:#E2E7ED;
  --brass:#8A671C; --brass-wash:#F2EBDA;
  --verdigris:#1A6350; --verdigris-wash:#E0EFE9;
  --amber:#8A5A12; --amber-wash:#F7EBD6;
  --crimson:#96292B; --crimson-wash:#F7E4E3;
  --slate:#3A5470; --slate-wash:#E3E9F1;
  --shadow:0 1px 2px rgba(14,21,32,.05), 0 8px 24px -16px rgba(14,21,32,.30);
  --drawer-shadow:-8px 0 40px -12px rgba(14,21,32,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1017; --card:#121A23; --sunk:#18222D; --hover:#1B2632;
    --ink:#E3E9F0; --muted:#98A6B6; --faint:#6C7A8B;
    --rule:#26323F; --rule-soft:#1C2733;
    --brass:#D6AB55; --brass-wash:#292217;
    --verdigris:#5FBFA2; --verdigris-wash:#11261F;
    --amber:#D8A34D; --amber-wash:#2A2014;
    --crimson:#E28B87; --crimson-wash:#2B1817;
    --slate:#9FB6CE; --slate-wash:#1A242F;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -20px rgba(0,0,0,.9);
    --drawer-shadow:-8px 0 40px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1017; --card:#121A23; --sunk:#18222D; --hover:#1B2632;
  --ink:#E3E9F0; --muted:#98A6B6; --faint:#6C7A8B;
  --rule:#26323F; --rule-soft:#1C2733;
  --brass:#D6AB55; --brass-wash:#292217;
  --verdigris:#5FBFA2; --verdigris-wash:#11261F;
  --amber:#D8A34D; --amber-wash:#2A2014;
  --crimson:#E28B87; --crimson-wash:#2B1817;
  --slate:#9FB6CE; --slate-wash:#1A242F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -20px rgba(0,0,0,.9);
  --drawer-shadow:-8px 0 40px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono,.m{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
h1,h2,h3{font-family:Spectral,Georgia,serif;margin:0;text-wrap:balance;font-weight:600}
h2{font-size:1.5rem;letter-spacing:-.01em}
h3{font-size:1.05rem}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ chrome ============ */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--rule);
}
.topbar-in{
  max-width:1400px;margin:0 auto;padding:0 20px;
  display:flex;align-items:center;gap:22px;height:52px;
}
.brand{
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;
}
.brand b{color:var(--brass);font-weight:600}
nav.tabs{display:flex;gap:2px;height:100%;margin-left:6px}
nav.tabs button{
  background:none;border:0;padding:0 15px;height:100%;color:var(--muted);
  font-weight:500;border-bottom:2px solid transparent;letter-spacing:.005em;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
#saveflag{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap;
}
#saveflag.on{color:var(--brass)}
#saveflag.err{color:var(--crimson)}

.page{max-width:1400px;margin:0 auto;padding:22px 20px 90px}

/* ============ buttons ============ */
.btn{
  border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:4px;padding:6px 12px;font-weight:500;font-size:.86rem;
  white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
:root[data-theme="dark"] .btn.primary{color:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:var(--paper)}}
.btn.primary:hover{opacity:.86;background:var(--ink)}
.btn.sm{padding:3px 9px;font-size:.78rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--crimson)}

/* ============ kpis ============ */
.kpis{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:5px;
  overflow:hidden;margin-bottom:18px;
}
.kpi{background:var(--card);padding:13px 16px}
.kpi .n{font-family:"IBM Plex Mono",monospace;font-size:1.42rem;font-weight:600;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:4px}
.kpi .s{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--faint);
  opacity:.8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.alert .n{color:var(--crimson)}

/* ============ filter bar ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search],.filters select{
  background:var(--card);border:1px solid var(--rule);border-radius:4px;
  padding:6px 10px;font-size:.86rem;
}
.filters input[type=search]{min-width:210px;flex:1 1 210px;max-width:340px}
.chip{
  border:1px solid var(--rule);background:var(--card);border-radius:4px;
  padding:5px 11px;font-size:.8rem;font-weight:500;color:var(--muted);
}
.chip[aria-pressed="true"]{background:var(--brass-wash);border-color:var(--brass);color:var(--brass)}
.spacer{flex:1}
.count{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--faint);
  letter-spacing:.08em;white-space:nowrap}

/* ============ outreach period panel ============ */
.sentbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}
.sentbar input[type=date],.sentbar select{
  background:var(--card);border:1px solid var(--rule);border-radius:4px;
  padding:6px 10px;font-size:.86rem;
}
.sentbar .lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint)}
.sentpanel{
  border:1px solid var(--rule);border-radius:5px;background:var(--card);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px;
  display:flex;flex-direction:column;gap:12px;
}
.sentpanel .ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sentpanel .ph .t{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass)}
.sentpanel .ph .r{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--faint);letter-spacing:.04em}
.sentsum{display:flex;gap:22px;flex-wrap:wrap}
.sentsum .s .n{font-family:"IBM Plex Mono",monospace;font-size:1.2rem;font-weight:600;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.sentsum .s .k{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:2px}
.brk{display:flex;flex-direction:column;gap:0;max-height:260px;overflow-y:auto}
.brk-row{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.brk-row:last-child{border-bottom:0}
.brk-row .d{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);
  flex:0 0 118px;letter-spacing:.02em;white-space:nowrap}
.brk-row .track{flex:1;min-width:40px;height:9px;background:var(--sunk);border-radius:2px;overflow:hidden}
.brk-row .fillbar{display:block;height:100%;background:var(--brass);border-radius:2px}
.brk-row.zero .fillbar{background:var(--rule)}
.brk-row .n{font-family:"IBM Plex Mono",monospace;font-size:.74rem;flex:0 0 42px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.brk-row.zero .n{color:var(--faint)}
.brk-row .sub{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--faint);
  flex:0 0 96px;text-align:right;white-space:nowrap}

/* ============ outreach log ============ */
.elog{display:flex;flex-direction:column;gap:0}
.erow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.erow:last-child{border-bottom:0}
.erow input[type=date],.erow select{
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  padding:4px 7px;font-size:.8rem;
}
.erow input[type=date]{flex:0 0 138px}
.erow select{flex:0 0 116px}
.erow .sj{flex:1;min-width:60px;font-size:.78rem;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .del{background:none;border:0;color:var(--faint);font-size:1rem;padding:0 4px;line-height:1}
.erow .del:hover{color:var(--crimson)}

/* ============ tables ============ */
.tablewrap{overflow:auto;max-height:calc(100vh - 232px);min-height:260px;border:1px solid var(--rule);border-radius:5px;background:var(--card);box-shadow:var(--shadow);overscroll-behavior:contain}
table{border-collapse:collapse;width:100%;font-size:.88rem}
thead th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500;
  padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--sunk);
  white-space:nowrap;position:sticky;top:0;z-index:5;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .car{color:var(--brass)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--rule-soft);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.nm{font-weight:600}
td .sub{display:block;font-size:.72rem;color:var(--faint);font-weight:400;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace;font-size:.8rem}
.empty{padding:44px 20px;text-align:center;color:var(--faint);font-size:.9rem}

/* ============ pills / dots ============ */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;font-weight:500;letter-spacing:.04em;padding:2px 8px;
  border-radius:3px;white-space:nowrap;border:1px solid transparent;
}
.p-grey{background:var(--sunk);color:var(--muted);border-color:var(--rule)}
.p-slate{background:var(--slate-wash);color:var(--slate);border-color:var(--slate)}
.p-brass{background:var(--brass-wash);color:var(--brass);border-color:var(--brass)}
.p-amber{background:var(--amber-wash);color:var(--amber);border-color:var(--amber)}
.p-green{background:var(--verdigris-wash);color:var(--verdigris);border-color:var(--verdigris)}
.p-red{background:var(--crimson-wash);color:var(--crimson);border-color:var(--crimson)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.d1{background:var(--crimson)} .d2{background:var(--brass)} .d3{background:var(--faint)}
.stale{color:var(--crimson);font-family:"IBM Plex Mono",monospace;font-size:.74rem}
.fresh{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:.74rem}

/* ============ drawer ============ */
.scrim{position:fixed;inset:0;background:rgba(14,21,32,.34);z-index:50;backdrop-filter:blur(1.5px)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:51;
  background:var(--card);border-left:1px solid var(--rule);box-shadow:var(--drawer-shadow);
  display:flex;flex-direction:column;
}
.drawer-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:flex-start;gap:14px;
}
.drawer-head h2{line-height:1.2}
.drawer-head .sub{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--faint);
  letter-spacing:.04em;margin-top:5px;display:block}
.drawer-body{overflow-y:auto;padding:18px 22px 40px;flex:1;display:flex;flex-direction:column;gap:20px}
.drawer-foot{
  border-top:1px solid var(--rule);padding:12px 22px;display:flex;gap:8px;
  align-items:center;background:var(--sunk);
}
.xbtn{background:none;border:0;color:var(--faint);font-size:1.35rem;line-height:1;
  padding:2px 6px;margin-left:auto;border-radius:3px}
.xbtn:hover{color:var(--ink);background:var(--hover)}

/* ============ forms ============ */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint)}
.f input,.f select,.f textarea{
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  padding:7px 9px;font-size:.9rem;width:100%;
}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--card);border-color:var(--brass);outline:none}
.f .hint{font-size:.72rem;color:var(--faint)}
.fieldset{display:flex;flex-direction:column;gap:11px}
.fieldset > .lg{
  font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--brass);padding-bottom:6px;border-bottom:1px solid var(--rule);
}
.checkline{display:flex;align-items:center;gap:8px;font-size:.88rem}
.checkline input{width:15px;height:15px;accent-color:var(--brass)}

/* ============ modal ============ */
.modal{
  position:fixed;z-index:60;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(680px,calc(100vw - 28px));max-height:calc(100vh - 48px);
  background:var(--card);border:1px solid var(--rule);border-radius:7px;
  box-shadow:0 24px 70px -18px rgba(14,21,32,.5);display:flex;flex-direction:column;
}
.modal-head{padding:18px 22px 12px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.modal-body{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:13px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;
  align-items:center;background:var(--sunk);border-radius:0 0 7px 7px}
.bigname input{font-size:1.15rem;padding:10px 12px;font-family:Spectral,Georgia,serif}

/* ============ notes ============ */
.notes{display:flex;flex-direction:column;gap:0}
.note{padding:10px 0;border-bottom:1px solid var(--rule-soft);display:flex;gap:12px;align-items:flex-start}
.note:last-child{border-bottom:0}
.note .d{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--faint);
  flex:0 0 62px;padding-top:3px;letter-spacing:.03em}
.note .t{font-size:.89rem;white-space:pre-wrap;flex:1;min-width:0;word-break:break-word}
.note .del{opacity:0;background:none;border:0;color:var(--faint);font-size:.9rem;padding:0 4px}
.note:hover .del{opacity:1}
.note .del:hover{color:var(--crimson)}

/* ============ stage rail ============ */
.rail{display:flex;flex-wrap:wrap;gap:5px}
.rail button{
  border:1px solid var(--rule);background:var(--card);border-radius:3px;
  padding:3px 8px;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  color:var(--muted);letter-spacing:.03em;
}
.rail button:hover{border-color:var(--brass);color:var(--brass)}
.rail button.on{background:var(--brass);border-color:var(--brass);color:var(--card)}
:root[data-theme="dark"] .rail button.on{color:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rail button.on{color:var(--paper)}}

/* ============ compose ============ */
.composewrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:940px){.composewrap{grid-template-columns:236px minmax(0,1fr);align-items:start}}
.tmpl-list{border:1px solid var(--rule);border-radius:5px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.tmpl-list .lg{
  font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--rule);
}
.tmpl{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:9px 14px;font-size:.86rem;color:var(--muted);border-left:2px solid transparent;
  border-bottom:1px solid var(--rule-soft);
}
.tmpl:last-child{border-bottom:0}
.tmpl:hover{background:var(--hover);color:var(--ink)}
.tmpl.on{background:var(--card);color:var(--ink);border-left-color:var(--brass);font-weight:600}
.mailcard{border:1px solid var(--rule);border-radius:5px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.mailhead{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:9px}
.mailrow{display:flex;gap:11px;align-items:baseline;font-size:.88rem;min-width:0}
.mailrow .lbl{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);flex:0 0 44px}
.mailrow .val{min-width:0;word-break:break-word}
#mailbody{
  padding:18px;font-size:.94rem;line-height:1.68;white-space:pre-wrap;
  min-height:280px;border:0;width:100%;background:var(--card);resize:vertical;
}
#mailbody:focus{outline:none}
.mailfoot{padding:11px 18px;border-top:1px solid var(--rule);background:var(--sunk);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.merge{background:var(--brass-wash);color:var(--brass);border-radius:2px;padding:0 3px;
  font-family:"IBM Plex Mono",monospace;font-size:.85em}
.warnline{color:var(--crimson);font-size:.78rem;font-family:"IBM Plex Mono",monospace}
.okline{color:var(--verdigris);font-size:.78rem;font-family:"IBM Plex Mono",monospace}

/* ============ settings ============ */
.setcard{border:1px solid var(--rule);border-radius:5px;background:var(--card);
  padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.tmpl-edit{border:1px solid var(--rule-soft);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gaps{display:flex;flex-direction:column;gap:0}
.gap{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-soft);align-items:center;font-size:.88rem}
.gap:last-child{border-bottom:0}
.gap .fn{font-weight:600;flex:1;min-width:0}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:4px;
  font-size:.86rem;font-weight:500;box-shadow:0 8px 30px -8px rgba(0,0,0,.5);
}
:root[data-theme="dark"] .toast{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--card);color:var(--ink);border:1px solid var(--rule)}}
.sectitle{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}
.sectitle .e{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.hr{height:1px;background:var(--rule);border:0;margin:0}
@media(max-width:620px){
  .topbar-in{gap:8px;padding:0 12px}
  .brand{display:none}
  nav.tabs button{padding:0 10px;font-size:.9rem}
  .page{padding:16px 12px 80px}
  .tablewrap{max-height:none;overflow:auto hidden;overflow-x:auto}
  thead th{position:static}
}
</style>



<div class="topbar">

<script>
(function(){
"use strict";

var SEED = JSON.parse(document.getElementById("app-state").textContent);
var state = SEED;

/* ---------- helpers ---------- */
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function $(id){ return document.getElementById(id); }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
/* local date, not UTC — toISOString() rolls over a day early for US evenings */
function today(){ var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function daysSince(iso){
  if(!iso) return null;
  var ms = Date.parse(iso + "T00:00:00");
  if (isNaN(ms)) return null;
  return Math.floor((Date.parse(today() + "T00:00:00") - ms) / 86400000);
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function firm(id){ for(var i=0;i<state.firms.length;i++) if(state.firms[i].id===id) return state.firms[i]; return null; }
function firmName(id){ var f = firm(id); return f ? f.name : ""; }
function contact(id){ for(var i=0;i<state.contacts.length;i++) if(state.contacts[i].id===id) return state.contacts[i]; return null; }
function fullName(c){ return (c.first + " " + (c.last||"")).trim(); }
function ssGet(k){ try { return sessionStorage.getItem(k) || ""; } catch(e){ return ""; } }
function ssSet(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }
function esc(s){ return String(s==null?"":s); }

/* ---------- persistence: document store, with a local fallback ---------- */
var db = null, dirty = false, saving = false, timer = null, ready = false;
var LS = "coverage.state.v1";
var flag = $("saveflag");
function setFlag(txt, cls){ flag.textContent = txt; flag.className = cls || ""; }

/* Three documents rather than one: each stays far under the per-document
   size cap as the contact list grows, and only what changed gets written. */
function shard(st){
  return {
    "app/meta":     {profile: st.profile, settings: st.settings, stages: st.stages, templates: st.templates},
    "app/contacts": {list: st.contacts},
    "app/firms":    {list: st.firms}
  };
}
var written = {};

function assemble(meta, contacts, firms){
  return {
    profile: meta.profile || SEED.profile,
    settings: meta.settings || SEED.settings,
    stages: (meta.stages && meta.stages.length) ? meta.stages : SEED.stages,
    templates: (meta.templates && meta.templates.length) ? meta.templates : SEED.templates,
    contacts: contacts.list || [],
    firms: firms.list || []
  };
}
function lsLoad(){
  try {
    var raw = localStorage.getItem(LS);
    if (raw) state = JSON.parse(raw);
  } catch(e){}
}
function lsSave(){
  try { localStorage.setItem(LS, JSON.stringify(state)); return true; } catch(e){ return false; }
}

function markWritten(){
  var sh = shard(state);
  for (var k in sh) written[k] = JSON.stringify(sh[k]);
}

function boot(){
  var p = (typeof window.claude !== "undefined" && window.claude && window.claude.use)
    ? window.claude.use("db") : Promise.resolve(null);
  return p.catch(function(){ return null; }).then(function(d){
    db = d;
    if (!db){
      lsLoad(); ready = true;
      setFlag("saved locally", "");
      if (migrateState()) save();
      return;
    }
    return Promise.all([
      db.doc("app/meta").get(), db.doc("app/contacts").get(), db.doc("app/firms").get()
    ]).then(function(sn){
      if (sn[0].exists && sn[1].exists && sn[2].exists){
        if (dirty){
          /* the viewer edited while we were still loading — their copy wins */
          ready = true; written = {};
          return writeAll().then(function(){ dirty = false; setFlag("saved"); });
        }
        state = assemble(sn[0].data(), sn[1].data(), sn[2].data());
        markWritten();
        ready = true; setFlag("saved");
        if (migrateState()) save();
      } else {
        /* first run on this artifact — plant the imported spreadsheet */
        ready = true;
        return writeAll().then(function(){ setFlag("saved"); });
      }
    });
  }).catch(function(){
    db = null; lsLoad(); ready = true; setFlag("saved locally", "");
    if (migrateState()) save();
  });
}

function writeAll(){
  var sh = shard(state), jobs = [];
  for (var k in sh){
    var j = JSON.stringify(sh[k]);
    if (written[k] !== j){
      written[k] = j;
      jobs.push(db.doc(k).set(sh[k]));
    }
  }
  return Promise.all(jobs);
}

function save(){
  dirty = true;
  setFlag("unsaved", "on");
  clearTimeout(timer);
  timer = setTimeout(flush, 700);
}
function flush(){
  if (!dirty || saving || !ready) return;
  if (!db){ dirty = !lsSave(); setFlag(dirty ? "not saved \u2014 storage blocked" : "saved locally", dirty ? "err" : ""); return; }
  saving = true; setFlag("saving…", "on");
  writeAll().then(function(){
    saving = false; dirty = false; setFlag("saved");
  }).catch(function(e){
    saving = false;
    var code = e && e.code;
    if (code === "unavailable"){ setFlag("retrying…", "err"); setTimeout(flush, 2500); }
    else setFlag("not saved" + (code ? " (" + code + ")" : ""), "err");
  });
}
window.addEventListener("beforeunload", function(e){
  if (dirty){ e.preventDefault(); e.returnValue = ""; }
});

function toast(msg){
  var t = h("div", {class:"toast", text:msg});
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ---------- derived ---------- */
var STAGE_CLASS = {
  "Not Contacted":"p-grey", "Emailed":"p-amber", "Follow-Up 1":"p-slate", "Follow-Up 2":"p-slate",
  "Replied":"p-brass", "Call Scheduled":"p-brass", "Call Done":"p-green",
  "Thank-You Sent":"p-green", "Advocate":"p-green", "Dead":"p-red"
};
function stageClass(s){ return STAGE_CLASS[s] || "p-grey"; }
function staleDays(c){
  var d = daysSince(c.lastContact);
  if (c.stage === "Replied") return d === null ? 0 : d;
  if (c.stage === "Emailed" || c.stage === "Follow-Up 1" || c.stage === "Follow-Up 2") return d;
  return null;
}
function isStale(c){
  if (c.stage === "Replied"){ var r = daysSince(c.lastContact); return r === null || r >= 1; }
  var d = staleDays(c);
  return d !== null && d >= (state.settings.bumpDays || 7);
}
function needsAction(c){
  if (c.stage === "Dead" || c.stage === "Advocate") return false;
  if (c.stage === "Not Contacted") return c.priority <= 2;
  if (c.stage === "Replied") return true;
  return isStale(c);
}
function firmContacts(fid){ return state.contacts.filter(function(c){ return c.firmId === fid; }); }

/* ---------- the outreach log ----------
   Every email you send is one entry: {id, d:"YYYY-MM-DD", type:"initial"|"followup", subject}.
   Counting real, dated entries is what makes "emails sent", the reply rate and the
   sent-period filter agree with each other — a single `touches` number could not say
   *when* anything went out, and nothing kept it in step with the stage rail.
   `touches` is still written on every change so old exports and backups keep working. */
function parseDate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
/* component arithmetic, not +n*86400000 — a DST shift would land on the wrong day */
function shiftDate(iso, days){
  var d = parseDate(iso) || parseDate(today());
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function startOfWeek(iso){
  var d = parseDate(iso); if (!d) return iso;
  return shiftDate(iso, -((d.getDay() + 6) % 7));   /* weeks run Monday → Sunday */
}
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var WDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function prettyDate(iso){
  var d = parseDate(iso); if (!d) return "—";
  return MONTHS[d.getMonth()] + " " + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : "");
}

function emailLog(c){
  if (!Array.isArray(c.emails)) c.emails = [];
  return c.emails;
}
function sortEmails(c){
  emailLog(c).sort(function(a,b){ return String(a.d||"").localeCompare(String(b.d||"")); });
  return c.emails;
}
function emailCount(c){ return emailLog(c).length; }
function emailsOfType(c, type){
  var l = sortEmails(c);
  if (!type || type === "all") return l.slice();
  return l.filter(function(e){ return e.type === type; });
}
function initialEmail(c){
  var l = sortEmails(c);
  for (var i=0;i<l.length;i++) if (l[i].type === "initial") return l[i];
  return l[0] || null;
}
function initialDate(c){ var e = initialEmail(c); return e ? e.d : ""; }
function followUpCount(c){ return emailsOfType(c, "followup").length; }
function lastEmailDate(c){ var l = sortEmails(c); return l.length ? l[l.length-1].d : ""; }
function nextEmailType(c){
  return emailLog(c).some(function(e){ return e.type === "initial"; }) ? "followup" : "initial";
}
function syncEmails(c){
  sortEmails(c);
  c.touches = emailCount(c);
  var last = lastEmailDate(c);
  if (last && (!c.lastContact || last > c.lastContact)) c.lastContact = last;
}
function addEmail(c, type, date, subject){
  var e = {id: uid("e"), d: date || today(), type: type === "initial" ? "initial" : "followup",
           subject: subject || ""};
  emailLog(c).push(e);
  syncEmails(c);
  return e;
}

var REPLIED_STAGES = {"Replied":1,"Call Scheduled":1,"Call Done":1,"Thank-You Sent":1,"Advocate":1};
/* a contact sitting in Call Done plainly replied, whether or not the box was ever ticked */
function hasReplied(c){ return !!c.replied || !!REPLIED_STAGES[c.stage]; }
function wasEmailed(c){
  return emailCount(c) > 0 || hasReplied(c) || (!!c.lastContact && c.stage !== "Not Contacted");
}

/* ---------- migration: build a log for records saved before it existed ---------- */
function migrateContact(c){
  var changed = false;
  if (!Array.isArray(c.emails)){
    c.emails = [];
    var n = Math.max(0, parseInt(c.touches, 10) || 0);
    if (!n && wasEmailed(c)) n = 1;
    if (n){
      /* only the most recent send has a date on file; space the earlier ones back by
         the bump interval and mark them estimated so they can be corrected by hand */
      var gap = (state.settings && state.settings.bumpDays) || 7;
      var anchor = c.lastContact || today();
      for (var i = n - 1; i >= 0; i--){
        c.emails.push({
          id: uid("e"), d: shiftDate(anchor, -i * gap),
          type: (i === n - 1) ? "initial" : "followup",
          subject: "", est: i > 0 || !c.lastContact
        });
      }
    }
    changed = true;
  }
  if (!c.replied && REPLIED_STAGES[c.stage]){ c.replied = true; changed = true; }
  if (c.touches !== emailCount(c)){ c.touches = emailCount(c); changed = true; }
  return changed;
}
function migrateState(){
  var changed = false;
  (state.contacts || []).forEach(function(c){ if (migrateContact(c)) changed = true; });
  return changed;
}

/* ---------- routing ---------- */
var TABS = [["contacts","Contacts"],["firms","Firms"],["compose","Compose"],["settings","Settings"]];
var route = ssGet("cov.tab") || "contacts";
var ui = {
  q:"", stage:"", prio:"", firm:"", needs:false, sort:"auto", desc:false,
  fq:"", ftarget:"", ftier:"", fgap:false,
  sentPeriod: ssGet("cov.sentPeriod"), sentType: ssGet("cov.sentType") || "initial",
  sentFrom: ssGet("cov.sentFrom"), sentTo: ssGet("cov.sentTo"), sentGroup: ssGet("cov.sentGroup") || "auto",
  composeTo: ssGet("cov.to"), composeTpl: "", draft:null
};

function go(r){
  route = r; ssSet("cov.tab", r); render();
}
function renderTabs(){
  var nav = $("tabs"); clear(nav);
  TABS.forEach(function(t){
    nav.appendChild(h("button", {
      "aria-current": route === t[0] ? "true" : "false",
      onclick: function(){ go(t[0]); }, text: t[1]
    }));
  });
}
function render(){
  renderTabs();
  var v = $("view"); clear(v);
  if (route === "contacts") viewContacts(v);
  else if (route === "firms") viewFirms(v);
  else if (route === "compose") viewCompose(v);
  else viewSettings(v);
}

/* ================= CONTACTS ================= */
/* ---------- sent-period filter ---------- */
var SENT_PERIODS = [
  ["","Sent: any time"],["today","Sent today"],["yesterday","Sent yesterday"],
  ["7","Sent in last 7 days"],["14","Sent in last 14 days"],["30","Sent in last 30 days"],
  ["90","Sent in last 90 days"],["week","Sent this week"],["lastweek","Sent last week"],
  ["month","Sent this month"],["lastmonth","Sent last month"],["custom","Sent in custom range…"]
];
var SENT_TYPES = [["initial","Initial outreach"],["followup","Follow-ups"],["all","Initial + follow-ups"]];
function sentTypeLabel(){
  for (var i=0;i<SENT_TYPES.length;i++) if (SENT_TYPES[i][0] === ui.sentType) return SENT_TYPES[i][1];
  return "Initial outreach";
}
function sentRange(){
  var p = ui.sentPeriod, t = today();
  if (!p) return null;
  if (p === "custom"){
    if (!ui.sentFrom && !ui.sentTo) return null;
    return {from: ui.sentFrom || "1900-01-01", to: ui.sentTo || "9999-12-31",
      label: (ui.sentFrom ? prettyDate(ui.sentFrom) : "the beginning") + " → " + (ui.sentTo ? prettyDate(ui.sentTo) : "today")};
  }
  if (p === "today") return {from:t, to:t, label:"today"};
  if (p === "yesterday"){ var y = shiftDate(t,-1); return {from:y, to:y, label:"yesterday"}; }
  if (p === "week"){ var w = startOfWeek(t); return {from:w, to:t, label:"this week"}; }
  if (p === "lastweek"){ var lw = shiftDate(startOfWeek(t),-7); return {from:lw, to:shiftDate(lw,6), label:"last week"}; }
  if (p === "month") return {from: t.slice(0,8) + "01", to:t, label:"this month"};
  if (p === "lastmonth"){
    var prevEnd = shiftDate(t.slice(0,8) + "01", -1);
    return {from: prevEnd.slice(0,8) + "01", to: prevEnd, label:"last month"};
  }
  var n = parseInt(p,10);
  if (n) return {from: shiftDate(t, -(n-1)), to: t, label:"the last " + n + " days"};
  return null;
}
function spanDays(r){
  var a = parseDate(r.from), b = parseDate(r.to);
  if (!a || !b) return 1;
  return Math.max(1, Math.round((b - a) / 86400000) + 1);
}
function inRange(d, r){ return !!d && (!r || (d >= r.from && d <= r.to)); }
/* the emails a contact has of the chosen type inside the chosen period */
function matchedEmails(c, r){
  return emailsOfType(c, ui.sentType).filter(function(e){ return inRange(e.d, r); });
}
function bucketsFor(r, grain){
  var out = [], cur = grain === "week" ? startOfWeek(r.from) : r.from, guard = 0;
  while (cur <= r.to && guard++ < 400){
    out.push({from: cur, to: grain === "week" ? shiftDate(cur,6) : cur, n:0, initial:0, followup:0});
    cur = shiftDate(cur, grain === "week" ? 7 : 1);
  }
  return out;
}
function grainFor(r){
  if (ui.sentGroup === "day" || ui.sentGroup === "week") return ui.sentGroup;
  return spanDays(r) > 31 ? "week" : "day";   /* auto */
}
function bucketLabel(b, grain){
  if (grain === "day"){
    var d = parseDate(b.from);
    return (d ? WDAYS[(d.getDay()+6)%7] + " · " : "") + prettyDate(b.from);
  }
  return prettyDate(b.from) + " – " + prettyDate(b.to);
}

function viewContacts(v){
  var cs = state.contacts;
  var sent = 0, initialCount = 0, fupCount = 0, calls = 0, refs = 0, act = 0;
  var emailedPeople = 0, repliedPeople = 0;
  cs.forEach(function(c){
    syncEmails(c);
    sent += emailCount(c);
    initialCount += emailsOfType(c, "initial").length;
    fupCount += followUpCount(c);
    if (wasEmailed(c)){ emailedPeople++; if (hasReplied(c)) repliedPeople++; }
    if (c.callDate || c.stage === "Call Done" || c.stage === "Thank-You Sent" || c.stage === "Advocate") calls++;
    if (c.referral) refs++;
    if (needsAction(c)) act++;
  });
  /* numerator and denominator are the same population now: people you actually emailed */
  var rate = emailedPeople ? Math.round(repliedPeople / emailedPeople * 100) + "%" : "—";

  var kp = h("div", {class:"kpis"});
  [[cs.length, "Contacts", emailedPeople + " emailed"],
   [sent, "Emails sent", initialCount + " initial · " + fupCount + " follow-up" + (fupCount === 1 ? "" : "s")],
   [rate, "Reply rate", repliedPeople + " of " + emailedPeople + " emailed"],
   [calls, "Calls done", ""],
   [refs, "Referrals", ""]].forEach(function(k){
    kp.appendChild(h("div",{class:"kpi"},[
      h("div",{class:"n",text:String(k[0])}),
      h("div",{class:"k",text:k[1]}),
      k[2] ? h("div",{class:"s",text:k[2]}) : null
    ]));
  });
  kp.appendChild(h("div",{class:"kpi" + (act ? " alert" : "")},[
    h("div",{class:"n",text:String(act)}), h("div",{class:"k",text:"Needs action"})
  ]));
  v.appendChild(kp);

  /* filters */
  var f = h("div",{class:"filters"});
  var q = h("input",{type:"search",placeholder:"Search name, firm, group, connection…",value:ui.q});
  q.addEventListener("input", function(){ ui.q = q.value; drawAll(); });
  f.appendChild(q);

  var sel = h("select");
  sel.appendChild(h("option",{value:"",text:"All stages"}));
  state.stages.forEach(function(s){ sel.appendChild(h("option",{value:s,text:s,selected:ui.stage===s?"selected":null})); });
  sel.addEventListener("change", function(){ ui.stage = sel.value; drawAll(); });
  f.appendChild(sel);

  var psel = h("select");
  [["","All priorities"],["1","P1 only"],["2","P2 only"],["3","P3 only"]].forEach(function(o){
    psel.appendChild(h("option",{value:o[0],text:o[1],selected:ui.prio===o[0]?"selected":null}));
  });
  psel.addEventListener("change", function(){ ui.prio = psel.value; drawAll(); });
  f.appendChild(psel);

  var fsel = h("select");
  fsel.appendChild(h("option",{value:"",text:"All firms"}));
  state.firms.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(fm){
    fsel.appendChild(h("option",{value:fm.id,text:fm.name,selected:ui.firm===fm.id?"selected":null}));
  });
  fsel.addEventListener("change", function(){ ui.firm = fsel.value; drawAll(); });
  f.appendChild(fsel);

  var nb = h("button",{class:"chip","aria-pressed":ui.needs?"true":"false",text:"Needs action"});
  nb.addEventListener("click", function(){ ui.needs = !ui.needs; nb.setAttribute("aria-pressed", ui.needs?"true":"false"); drawAll(); });
  f.appendChild(nb);
  f.appendChild(h("span",{class:"spacer"}));
  var cnt = h("span",{class:"count"});
  f.appendChild(cnt);
  v.appendChild(f);

  /* sent-period bar — when an email went out, not when the contact was last touched */
  var sbar = h("div",{class:"sentbar"});
  v.appendChild(sbar);
  function drawSentBar(){
    clear(sbar);
    sbar.appendChild(h("span",{class:"lbl",text:"Sent"}));
    var per = h("select");
    SENT_PERIODS.forEach(function(o){
      per.appendChild(h("option",{value:o[0],text:o[1],selected:ui.sentPeriod===o[0]?"selected":null}));
    });
    per.addEventListener("change", function(){
      ui.sentPeriod = per.value; ssSet("cov.sentPeriod", ui.sentPeriod); drawSentBar(); drawAll();
    });
    sbar.appendChild(per);

    var tsel = h("select");
    SENT_TYPES.forEach(function(o){
      tsel.appendChild(h("option",{value:o[0],text:o[1],selected:ui.sentType===o[0]?"selected":null}));
    });
    tsel.addEventListener("change", function(){
      ui.sentType = tsel.value; ssSet("cov.sentType", ui.sentType); drawAll();
    });
    sbar.appendChild(tsel);

    if (ui.sentPeriod === "custom"){
      var from = h("input",{type:"date",value:ui.sentFrom,"aria-label":"Sent from"});
      from.addEventListener("change", function(){ ui.sentFrom = from.value; ssSet("cov.sentFrom", from.value); drawAll(); });
      var to = h("input",{type:"date",value:ui.sentTo,"aria-label":"Sent to"});
      to.addEventListener("change", function(){ ui.sentTo = to.value; ssSet("cov.sentTo", to.value); drawAll(); });
      sbar.appendChild(from);
      sbar.appendChild(h("span",{class:"lbl",text:"to"}));
      sbar.appendChild(to);
    }
    if (ui.sentPeriod){
      [["auto","Auto"],["day","By day"],["week","By week"]].forEach(function(g){
        var b = h("button",{class:"chip",text:g[1],"aria-pressed":ui.sentGroup===g[0]?"true":"false",
          onclick:function(){ ui.sentGroup = g[0]; ssSet("cov.sentGroup", g[0]); drawSentBar(); drawAll(); }});
        sbar.appendChild(b);
      });
      sbar.appendChild(h("button",{class:"chip",text:"Clear",onclick:function(){
        ui.sentPeriod = ""; ui.sentFrom = ""; ui.sentTo = "";
        ssSet("cov.sentPeriod",""); ssSet("cov.sentFrom",""); ssSet("cov.sentTo","");
        drawSentBar(); drawAll();
      }}));
    }
  }
  drawSentBar();

  var panel = h("div",{class:"sentpanel"});
  panel.style.display = "none";
  v.appendChild(panel);

  var wrap = h("div",{class:"tablewrap"});
  var tbl = h("table");
  var cols = [["pri","Pri"],["name","Name"],["firm","Firm / Group"],["conn","Connection"],
              ["stage","Stage"],["sent","Initial sent"],["last","Last touch"],["next","Next action"]];
  var thead = h("thead"); var tr = h("tr");
  cols.forEach(function(c){
    var th = h("th",{class:"sortable",onclick:function(){
      if (ui.sort === c[0]) ui.desc = !ui.desc; else { ui.sort = c[0]; ui.desc = false; }
      drawAll();
    }});
    th.appendChild(document.createTextNode(c[1]));
    if (ui.sort === c[0]) th.appendChild(h("span",{class:"car",text: ui.desc ? " ▾" : " ▴"}));
    tr.appendChild(th);
  });
  thead.appendChild(tr); tbl.appendChild(thead);
  var tbody = h("tbody"); tbl.appendChild(tbody);
  wrap.appendChild(tbl); v.appendChild(wrap);

  function filtered(){
    var s = ui.q.trim().toLowerCase(), r = sentRange();
    return state.contacts.filter(function(c){
      if (ui.stage && c.stage !== ui.stage) return false;
      if (ui.prio && String(c.priority) !== ui.prio) return false;
      if (ui.firm && c.firmId !== ui.firm) return false;
      if (ui.needs && !needsAction(c)) return false;
      if (r && !matchedEmails(c, r).length) return false;
      /* a dead contact you emailed still counts toward what you sent that week */
      if (!ui.stage && !ui.q && !r && c.stage === "Dead") return false;
      if (s){
        var hay = (fullName(c) + " " + firmName(c.firmId) + " " + c.group + " " + c.connection + " " + c.title + " " + (c.tags||[]).join(" ")).toLowerCase();
        if (hay.indexOf(s) < 0) return false;
      }
      return true;
    });
  }
  function sortRows(rows){
    var k = ui.sort, dir = ui.desc ? -1 : 1;
    var STAGE_ORDER = state.stages;
    rows.sort(function(a,b){
      var r = 0;
      if (k === "auto"){
        var na = needsAction(a) ? 0 : 1, nb2 = needsAction(b) ? 0 : 1;
        if (na !== nb2) return na - nb2;
        if (a.priority !== b.priority) return a.priority - b.priority;
        var da = staleDays(a), sb = staleDays(b);
        return (sb === null ? -1 : sb) - (da === null ? -1 : da);
      }
      if (k === "pri") r = a.priority - b.priority;
      else if (k === "name") r = fullName(a).localeCompare(fullName(b));
      else if (k === "firm") r = firmName(a.firmId).localeCompare(firmName(b.firmId));
      else if (k === "conn") r = (a.connection||"").localeCompare(b.connection||"");
      else if (k === "stage") r = STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage);
      else if (k === "sent") r = (initialDate(a) || "9999-12-31").localeCompare(initialDate(b) || "9999-12-31");
      else if (k === "last") r = (Date.parse(a.lastContact||"1970-01-01")||0) - (Date.parse(b.lastContact||"1970-01-01")||0);
      else if (k === "next") r = (a.nextAction||"").localeCompare(b.nextAction||"");
      return r * dir;
    });
    return rows;
  }

  function drawPanel(rows){
    clear(panel);
    var r = sentRange();
    if (!r){ panel.style.display = "none"; return; }
    panel.style.display = "";

    var grain = grainFor(r);
    var bs = bucketsFor(r, grain), byKey = {};
    bs.forEach(function(b){ byKey[b.from] = b; });
    var total = 0, ini = 0, fup = 0, people = 0, hits = [];
    rows.forEach(function(c){
      var es = matchedEmails(c, r);
      if (es.length) people++;
      es.forEach(function(e){
        total++;
        if (e.type === "initial") ini++; else fup++;
        hits.push({e:e, c:c});
        var key = grain === "week" ? startOfWeek(e.d) : e.d;
        var b = byKey[key];
        if (b){ b.n++; if (e.type === "initial") b.initial++; else b.followup++; }
      });
    });

    var head = h("div",{class:"ph"},[
      h("span",{class:"t",text:"Outreach — " + r.label}),
      h("span",{class:"r",text:sentTypeLabel() + "  ·  " + r.from + " → " + (r.to === "9999-12-31" ? today() : r.to)})
    ]);
    head.appendChild(h("span",{class:"spacer"}));
    head.appendChild(h("button",{class:"chip",text:"Copy as CSV",onclick:function(){
      var lines = ["Date,Type,Name,Firm,Subject"];
      hits.slice().sort(function(a,b){ return a.e.d.localeCompare(b.e.d); }).forEach(function(x){
        lines.push([x.e.d, x.e.type === "initial" ? "Initial" : "Follow-up", fullName(x.c),
          firmName(x.c.firmId), x.e.subject || ""].map(function(z){
            return '"' + String(z==null?"":z).replace(/"/g,'""') + '"'; }).join(","));
      });
      navigator.clipboard.writeText(lines.join("\n")).then(function(){ toast("Copied " + hits.length + " emails"); });
    }}));
    panel.appendChild(head);

    var days = spanDays(r);
    var perDay = days ? (Math.round(total / days * 10) / 10) : 0;
    var busiest = 0;
    bs.forEach(function(b){ if (b.n > busiest) busiest = b.n; });
    var sum = h("div",{class:"sentsum"});
    [[total,"Emails sent"],[ini,"Initial"],[fup,"Follow-ups"],[people,"Contacts"],
     [perDay,"Per day"],[busiest,"Busiest " + grain]].forEach(function(x){
      sum.appendChild(h("div",{class:"s"},[h("div",{class:"n",text:String(x[0])}),h("div",{class:"k",text:x[1]})]));
    });
    panel.appendChild(sum);

    if (!total){
      panel.appendChild(h("div",{class:"hint",style:"color:var(--faint);font-size:.82rem",
        text:"No " + sentTypeLabel().toLowerCase() + " logged in this period."}));
      return;
    }
    var brk = h("div",{class:"brk"});
    var shown = bs.slice(Math.max(0, bs.length - 120)).reverse();
    shown.forEach(function(b){
      var pct = busiest ? Math.round(b.n / busiest * 100) : 0;
      var row = h("div",{class:"brk-row" + (b.n ? "" : " zero")},[
        h("span",{class:"d",text:bucketLabel(b, grain)}),
        h("span",{class:"track"},[h("span",{class:"fillbar",style:"width:" + (b.n ? Math.max(pct,4) : 0) + "%"})]),
        h("span",{class:"n",text:String(b.n)}),
        h("span",{class:"sub",text: ui.sentType === "all" && b.n ? b.initial + " init · " + b.followup + " f/u" : ""})
      ]);
      brk.appendChild(row);
    });
    panel.appendChild(brk);
  }

  function drawRows(rows){
    clear(tbody);
    var r = sentRange();
    cnt.textContent = rows.length + " of " + state.contacts.length;
    if (!rows.length){
      var td = h("td",{colspan:"8"},[h("div",{class:"empty",
        text: r ? "Nobody was sent " + sentTypeLabel().toLowerCase() + " in that period."
                : "No contacts match. Clear the filters, or add someone."})]);
      tbody.appendChild(h("tr",{},[td]));
      return;
    }
    rows.forEach(function(c){
      /* days since the last touch, not staleDays() — that is null off-pipeline and rendered "nulld ago" */
      var d = daysSince(c.lastContact);
      var lastCell;
      if (!c.lastContact || d === null) lastCell = h("span",{class:"fresh",text:"—"});
      else if (isStale(c)) lastCell = h("span",{class:"stale",text:d + "d · stale"});
      else lastCell = h("span",{class:"fresh",text:d === 0 ? "today" : d + "d ago"});

      var ie = initialEmail(c), n = emailCount(c), fu = followUpCount(c);
      var sentCell = h("td",{});
      if (!ie) sentCell.appendChild(h("span",{class:"fresh",text:"—"}));
      else {
        sentCell.appendChild(h("span",{class:"fresh",text:(ie.est ? "~" : "") + prettyDate(ie.d)}));
        var subTxt = r ? matchedEmails(c, r).length + " in period"
                       : (fu ? "+" + fu + " follow-up" + (fu > 1 ? "s" : "") : n + " email" + (n > 1 ? "s" : ""));
        sentCell.appendChild(h("span",{class:"sub",text:subTxt}));
      }

      var tr2 = h("tr",{onclick:function(){ openContact(c.id); }},[
        h("td",{},[h("span",{class:"dot d"+c.priority,title:"P"+c.priority})]),
        h("td",{class:"nm"},[document.createTextNode(fullName(c)), h("span",{class:"sub",text:(c.title||"—")})]),
        h("td",{},[document.createTextNode(firmName(c.firmId) || "—"), h("span",{class:"sub",text:c.group||""})]),
        h("td",{},[document.createTextNode(c.connection || "—")]),
        h("td",{},[h("span",{class:"pill "+stageClass(c.stage),text:c.stage})]),
        sentCell,
        h("td",{},[lastCell]),
        h("td",{},[document.createTextNode(c.nextAction || "—")])
      ]);
      tbody.appendChild(tr2);
    });
  }
  function drawAll(){
    var rows = sortRows(filtered());
    drawPanel(rows);
    drawRows(rows);
  }
  drawAll();
}

/* ================= CONTACT DRAWER ================= */
function closeLayer(){ clear($("layer")); }
function drawer(title, sub, bodyBuild, footBuild){
  var layer = $("layer"); clear(layer);
  var scrim = h("div",{class:"scrim",onclick:closeLayer});
  var d = h("div",{class:"drawer",role:"dialog","aria-modal":"true"});
  var head = h("div",{class:"drawer-head"},[
    h("div",{},[h("h2",{text:title}), sub ? h("span",{class:"sub",text:sub}) : null]),
    h("button",{class:"xbtn",onclick:closeLayer,"aria-label":"Close",html:"&times;"})
  ]);
  var body = h("div",{class:"drawer-body"});
  bodyBuild(body);
  d.appendChild(head); d.appendChild(body);
  if (footBuild){ var foot = h("div",{class:"drawer-foot"}); footBuild(foot); d.appendChild(foot); }
  layer.appendChild(scrim); layer.appendChild(d);
  armEsc();
}
function escOnce(e){
  if (e.key === "Escape"){ closeLayer(); document.removeEventListener("keydown", escOnce); }
}
function armEsc(){ document.removeEventListener("keydown", escOnce); document.addEventListener("keydown", escOnce); }

function field(label, val, onchange, opts){
  opts = opts || {};
  var input;
  if (opts.type === "select"){
    input = h("select");
    (opts.options||[]).forEach(function(o){
      input.appendChild(h("option",{value:o,text:o||"—",selected:String(val)===String(o)?"selected":null}));
    });
  } else if (opts.type === "textarea"){
    input = h("textarea",{});
    input.value = esc(val);
  } else {
    input = h("input",{type:opts.type||"text",value:esc(val),placeholder:opts.ph||""});
    if (opts.list) input.setAttribute("list", opts.list);
  }
  input.addEventListener("change", function(){ onchange(input.value); });
  var f = h("div",{class:"f" + (opts.wide?" wide":"")},[h("label",{text:label}), input]);
  if (opts.hint) f.appendChild(h("div",{class:"hint",text:opts.hint}));
  return f;
}
function datalists(){
  var l = h("div");
  function dl(id, vals){
    var d = h("datalist",{id:id});
    vals.forEach(function(v){ if(v) d.appendChild(h("option",{value:v})); });
    l.appendChild(d);
  }
  dl("dl-firms", state.firms.map(function(f){ return f.name; }).sort());
  dl("dl-groups", uniq(state.contacts.map(function(c){ return c.group; })).concat(state.settings.groups||[]));
  dl("dl-conn", uniq(state.contacts.map(function(c){ return c.connection; })));
  dl("dl-title", ["Intern","Analyst 1","Analyst 2","Analyst 3","Associate","VP","Director","MD","Partner","Head of IB"]);
  dl("dl-office", uniq(state.contacts.map(function(c){ return c.office; })));
  return l;
}
function uniq(a){
  var o = {}, r = [];
  a.forEach(function(x){ x = (x||"").trim(); if (x && !o[x]){ o[x]=1; r.push(x); } });
  return r.sort();
}

function openContact(id){
  var c = contact(id); if (!c) return;
  var f = firm(c.firmId);
  drawer(fullName(c), [c.title, f ? f.name : "", c.group].filter(Boolean).join("  ·  "), function(body){
    body.appendChild(datalists());

    /* stage rail */
    var fs0 = h("div",{class:"fieldset"},[h("div",{class:"lg",text:"Stage"})]);
    var rail = h("div",{class:"rail"});
    state.stages.forEach(function(s){
      rail.appendChild(h("button",{class: c.stage===s?"on":"", text:s, onclick:function(){
        setStage(c, s); save(); openContact(id); render();
      }}));
    });
    fs0.appendChild(rail);
    body.appendChild(fs0);

    /* quick actions */
    var qa = h("div",{class:"filters"});
    var nextType = nextEmailType(c);
    qa.appendChild(h("button",{class:"btn sm",
      text: nextType === "initial" ? "Log initial outreach today" : "Log follow-up today",
      onclick:function(){
        logEmail(c, {type: nextType});
        save(); openContact(id); render(); toast("Logged — " + c.stage);
      }}));
    qa.appendChild(h("button",{class:"btn sm",text:"Mark replied",onclick:function(){
      c.replied = true; c.stage = "Replied"; c.lastContact = today();
      c.nextAction = "Propose call times"; save(); openContact(id); render();
    }}));
    qa.appendChild(h("button",{class:"btn sm",text:"Compose →",onclick:function(){
      ui.composeTo = c.id; ui.draft = null; ssSet("cov.to", c.id);
      closeLayer(); go("compose");
    }}));
    body.appendChild(qa);

    /* identity */
    var fs1 = h("div",{class:"fieldset"},[h("div",{class:"lg",text:"Who"})]);
    var g1 = h("div",{class:"fgrid"});
    g1.appendChild(field("First name", c.first, function(v){ c.first=v; save(); render(); }));
    g1.appendChild(field("Last name", c.last, function(v){ c.last=v; save(); render(); }));
    g1.appendChild(field("Firm", firmName(c.firmId), function(v){ c.firmId = firmIdFor(v); save(); render(); }, {list:"dl-firms"}));

/* how many emails a stage implies you have sent — moving the rail forward is how most
   people log a send, so the log is topped up to match instead of silently drifting */
var STAGE_EMAILS = {"Emailed":1,"Follow-Up 1":2,"Follow-Up 2":3};
function setStage(c, s){
  c.stage = s;
  if (STAGE_EMAILS[s]){
    while (emailCount(c) < STAGE_EMAILS[s]) addEmail(c, nextEmailType(c), today(), "");
    if (!c.lastContact) c.lastContact = today();
    c.nextAction = s === "Follow-Up 2" ? "Final bump sent — wait" : "Bump in " + (state.settings.bumpDays||7) + " days";
  }
  if (REPLIED_STAGES[s]) c.replied = true;
  if (s === "Replied"){ c.nextAction = "Propose call times"; }
  if (s === "Call Done"){ c.callDate = c.callDate || today(); c.nextAction = "Send thank-you"; c.nextDate = today(); }
  if (s === "Thank-You Sent"){ c.lastContact = today(); c.nextAction = "Keep warm — check in next month"; }
  if (s === "Advocate"){ c.referral = true; c.nextAction = ""; }
  if (s === "Dead"){ c.nextAction = ""; }
  if (s === "Not Contacted"){ c.nextAction = "Draft cold intro"; }
}
function logEmail(c, opts){
  opts = opts || {};
  addEmail(c, opts.type || nextEmailType(c), opts.date || today(), opts.subject || "");
  var order = ["Not Contacted","Emailed","Follow-Up 1","Follow-Up 2"];
  var i = order.indexOf(c.stage);
  if (i >= 0 && i < 3) c.stage = order[i+1];
  else if (c.stage === "Replied" || c.stage === "Call Scheduled"){ /* keep */ }
  else if (c.stage === "Call Done") c.stage = "Thank-You Sent";
  if (c.stage === "Emailed" || c.stage === "Follow-Up 1") c.nextAction = "Bump in " + (state.settings.bumpDays||7) + " days";
  else if (c.stage === "Follow-Up 2") c.nextAction = "Final bump sent — wait";
}
function firmIdFor(name){
  name = (name||"").trim();
  if (!name) return "";
  var n = name.toLowerCase();
  for (var i=0;i<state.firms.length;i++) if (state.firms[i].name.toLowerCase() === n) return state.firms[i].id;
  var nf = {id:uid("f"), name:name, tier:"", interest:0, difficulty:"", target:"No",
    emailPattern:"", hq:"", groups:"", headcount:"", appStatus:"Not open", opens:"", deadline:"",
    superday:"", referral:false, targetGroup:"", whyFirm:"", deals:"", sectors:"", alumni:""};
  state.firms.push(nf);
  return nf.id;
}
function guessEmail(c){
  var f = firm(c.firmId); if (!f || !f.emailPattern) return "";
  var dom = f.emailPattern.indexOf("@") >= 0 ? f.emailPattern.split("@")[1] : "";
  var pat = f.emailPattern.split("@")[0];
  var fi = (c.first||"").toLowerCase().replace(/[^a-z]/g,"");
  var la = (c.last||"").toLowerCase().replace(/[^a-z]/g,"");
  if (!fi || !la || !dom) return "";
  var local = pat
    .replace(/first/g, fi).replace(/last/g, la)
    .replace(/f\b/g, fi.charAt(0)).replace(/l\b/g, la.charAt(0));
  return local + "@" + dom;
}

    g3.appendChild(field("Difficulty", f.difficulty, function(v){ f.difficulty=v; save(); render(); }, {type:"select", options:DIFF}));
    g3.appendChild(field("Target group", f.targetGroup, function(v){ f.targetGroup=v; save(); }, {ph:"Restructuring"}));
    g3.appendChild(field("Alumni count", f.alumni, function(v){ f.alumni=v; save(); }));
    g3.appendChild(field("Why this firm", f.whyFirm, function(v){ f.whyFirm=v; save(); }, {type:"textarea", wide:true}));
    fs3.appendChild(g3); body.appendChild(fs3);

    var fs4 = h("div",{class:"fieldset"},[h("div",{class:"lg",text:"Market notes"})]);
    fs4.appendChild(field("Recent deals", f.deals, function(v){ f.deals=v; save(); }, {type:"textarea", wide:true, ph:"Used by the {{Deal}} merge field in cold emails"}));
    fs4.appendChild(field("Sector strengths", f.sectors, function(v){ f.sectors=v; save(); }, {type:"textarea", wide:true}));
    body.appendChild(fs4);

    var fs5 = h("div",{class:"fieldset"},[h("div",{class:"lg",text:"Contacts here (" + cs.length + ")"})]);
    if (!cs.length) fs5.appendChild(h("div",{class:"hint",text:"Nobody yet." + (f.target==="Yes" ? " This is a coverage gap." : "")}));
    cs.forEach(function(c){
      fs5.appendChild(h("div",{class:"gap"},[
        h("span",{class:"dot d"+c.priority}),
        h("span",{class:"fn",text:fullName(c) + (c.title ? "  ·  " + c.title : "")}),
        h("span",{class:"pill "+stageClass(c.stage),text:c.stage}),
        h("button",{class:"btn sm ghost",text:"Open",onclick:function(){ openContact(c.id); }})
      ]));
    });
    body.appendChild(fs5);
  }, function(foot){
    foot.appendChild(h("button",{class:"btn primary",text:"Done",onclick:function(){ flush(); closeLayer(); }}));
    foot.appendChild(h("span",{class:"spacer"}));
    foot.appendChild(h("button",{class:"btn danger sm",text:"Delete firm",onclick:function(){
      if (firmContacts(f.id).length){ toast("Move or delete its contacts first"); return; }
      if (!confirm("Delete " + f.name + "?")) return;
      state.firms = state.firms.filter(function(x){ return x.id !== f.id; });
      save(); closeLayer(); render();
    }}));
  });
}

/* ================= COMPOSE ================= */
function mergeMap(c){
  var f = firm(c.firmId) || {};
  var p = state.profile;
  return {
    FirstName: c.first, LastName: c.last, Name: fullName(c),
    Firm: f.name || "", Group: c.group || f.targetGroup || "", Title: c.title || "",
    Office: c.office || "", Connection: c.connection || "", School: c.school || "",
    GradYear: c.year || "", Deal: f.deals || "", Sectors: f.sectors || "",
    CallDate: c.callDate || "",
    MyName: p.name, MySchool: p.school, MyYear: p.year, MyMajor: p.major, MyGroups: p.groups
  };
}
function fill(tpl, map){
  return String(tpl||"").replace(/\{\{(\w+)\}\}/g, function(_, k){
    var v = map[k];
    return (v === undefined || v === null || v === "") ? "‹" + k + "›" : v;
  });
}
function missingFields(txt){
  var out = [], re = /‹(\w+)›/g, m;
  while ((m = re.exec(txt))) if (out.indexOf(m[1]) < 0) out.push(m[1]);
  return out;
}

function viewCompose(v){
  if (!state.contacts.length){ v.appendChild(h("div",{class:"empty",text:"Add a contact first."})); return; }
  var c = contact(ui.composeTo) || state.contacts[0];
  ui.composeTo = c.id;
  var tpl = state.templates.filter(function(t){ return t.id === ui.composeTpl; })[0] || state.templates[0];
  ui.composeTpl = tpl.id;

  var bar = h("div",{class:"filters"});
  var cs = h("select");
  state.contacts.slice().sort(function(a,b){ return fullName(a).localeCompare(fullName(b)); })
    .forEach(function(x){
      cs.appendChild(h("option",{value:x.id, text: fullName(x) + " — " + (firmName(x.firmId)||"no firm"), selected: x.id===c.id?"selected":null}));
    });
  cs.addEventListener("change", function(){
    ui.composeTo = cs.value; ui.draft = null; ssSet("cov.to", cs.value); render();
  });
  bar.appendChild(h("span",{class:"count",text:"TO"}));
  bar.appendChild(cs);
  bar.appendChild(h("span",{class:"spacer"}));
  bar.appendChild(h("button",{class:"btn sm",text:"Open contact",onclick:function(){ openContact(c.id); }}));
  v.appendChild(bar);

  var wrap = h("div",{class:"composewrap"});
  var list = h("div",{class:"tmpl-list"},[h("div",{class:"lg",text:"Templates"})]);
  state.templates.forEach(function(t){
    list.appendChild(h("button",{class:"tmpl"+(t.id===tpl.id?" on":""),text:t.name,onclick:function(){
      ui.composeTpl = t.id; ui.draft = null; render();
    }}));
  });
  wrap.appendChild(list);

  var map = mergeMap(c);
  var subj = fill(tpl.subject, map);
  var bodyTxt = ui.draft !== null && ui.draft !== undefined ? ui.draft : fill(tpl.body, map);

  var card = h("div",{class:"mailcard"});
  var head = h("div",{class:"mailhead"});
  var emailTxt = c.email || "— no address on file —";
  head.appendChild(h("div",{class:"mailrow"},[
    h("span",{class:"lbl",text:"To"}),
    h("span",{class:"val"},[
      document.createTextNode(emailTxt),
      c.email ? h("span",{class:"pill "+(c.emailConf==="verified"?"p-green":c.emailConf==="bounced"?"p-red":"p-amber"),
        text:c.emailConf}) : null
    ])
  ]));
  var subjIn = h("input",{type:"text",value:subj});
  subjIn.style.cssText = "border:0;background:none;width:100%;font-size:.92rem;padding:0";
  head.appendChild(h("div",{class:"mailrow"},[h("span",{class:"lbl",text:"Subj"}), h("span",{class:"val",style:"flex:1"},[subjIn])]));
  card.appendChild(head);

  var ta = h("textarea",{id:"mailbody"});
  ta.value = bodyTxt;
  ta.addEventListener("input", function(){ ui.draft = ta.value; updateWarn(); });
  card.appendChild(ta);

  var foot = h("div",{class:"mailfoot"});
  var warn = h("span",{});
  function updateWarn(){
    clear(warn);
    var miss = missingFields(ta.value + " " + subjIn.value);
    var cl = tpl.customLine ? fill(tpl.customLine, map) : "";
    var untouched = cl && ta.value.indexOf(cl) >= 0;
    if (miss.length) warn.appendChild(h("span",{class:"warnline",text:"blanks: " + miss.join(", ")}));
    else if (untouched) warn.appendChild(h("span",{class:"warnline",text:"custom line not written yet"}));
    else warn.appendChild(h("span",{class:"okline",text:"ready to send"}));
  }
  foot.appendChild(h("button",{class:"btn primary",text:"Copy email",onclick:function(){
    var txt = ta.value;
    navigator.clipboard.writeText(txt).then(function(){ toast("Copied"); }, function(){
      ta.select(); document.execCommand("copy"); toast("Copied");
    });
  }}));
  foot.appendChild(h("button",{class:"btn",text:"Copy subject",onclick:function(){
    navigator.clipboard.writeText(subjIn.value).then(function(){ toast("Subject copied"); });
  }}));
  foot.appendChild(h("button",{class:"btn",text:"Log as sent",onclick:function(){
    logEmail(c, {subject: subjIn.value});
    c.notes = c.notes || [];
    c.notes.unshift({d: today(), t: "Sent: " + subjIn.value});
    ui.draft = null; save(); render(); toast("Logged — " + c.stage);
  }}));
  foot.appendChild(h("button",{class:"btn ghost sm",text:"Reset to template",onclick:function(){ ui.draft = null; render(); }}));
  foot.appendChild(h("span",{class:"spacer"}));
  foot.appendChild(warn);
  card.appendChild(foot);
  updateWarn();

  wrap.appendChild(card);
  v.appendChild(wrap);

  var tip = h("div",{class:"sectitle"},[h("span",{class:"e",text:"Reminder"})]);
  v.appendChild(tip);
  v.appendChild(h("div",{class:"hint",style:"color:var(--muted);font-size:.88rem;max-width:70ch",
    text:"Rewrite the marked custom line before sending — it is the only part of the email that proves you did not mass-blast it. “Log as sent” advances the stage and writes a dated entry into the outreach log (initial the first time, follow-up after that), so it shows up in the Contacts tab’s sent-period filter."}));
}

/* ================= SETTINGS ================= */
function viewSettings(v){
  var p = state.profile;
  v.appendChild(h("div",{class:"sectitle"},[h("h2",{text:"Your profile"}),h("span",{class:"e",text:"fills the merge fields"})]));
  var c1 = h("div",{class:"setcard"});
  var g = h("div",{class:"fgrid"});
  g.appendChild(field("Name", p.name, function(x){ p.name=x; save(); }));
  g.appendChild(field("School", p.school, function(x){ p.school=x; save(); }));
  g.appendChild(field("Class year", p.year, function(x){ p.year=x; save(); }));
  g.appendChild(field("Major", p.major, function(x){ p.major=x; save(); }, {wide:true}));
  g.appendChild(field("Target groups", p.groups, function(x){ p.groups=x; save(); }, {wide:true}));
  g.appendChild(field("Your email", p.email, function(x){ p.email=x; save(); }));
  g.appendChild(field("Bump interval (days)", String(state.settings.bumpDays), function(x){
    state.settings.bumpDays = parseInt(x,10)||7; save(); }, {type:"number"}));
  c1.appendChild(g);
  v.appendChild(c1);

  v.appendChild(h("div",{class:"sectitle"},[h("h2",{text:"Templates"}),h("span",{class:"e",text:"{{merge fields}} pull from the contact, their firm, and your profile"})]));
  var c2 = h("div",{class:"setcard"});
  c2.appendChild(h("div",{class:"hint",style:"color:var(--muted)",
    text:"Available: FirstName LastName Firm Group Title Office Connection School GradYear Deal Sectors CallDate MyName MySchool MyYear MyMajor MyGroups"}));
  state.templates.forEach(function(t, i){
    var box = h("div",{class:"tmpl-edit"});
    box.appendChild(field("Template name", t.name, function(x){ t.name=x; save(); render(); }, {wide:true}));
    box.appendChild(field("Subject", t.subject, function(x){ t.subject=x; save(); }, {wide:true}));
    box.appendChild(field("Body", t.body, function(x){ t.body=x; save(); }, {type:"textarea", wide:true}));
    box.appendChild(field("Custom line (must be rewritten before sending)", t.customLine, function(x){ t.customLine=x; save(); }, {wide:true}));
    box.appendChild(h("div",{class:"filters"},[
      h("button",{class:"btn sm danger",text:"Delete template",onclick:function(){
        if (state.templates.length < 2){ toast("Keep at least one"); return; }
        if (!confirm("Delete “" + t.name + "”?")) return;
        state.templates.splice(i,1); save(); render();
      }})
    ]));
    c2.appendChild(box);
  });
  c2.appendChild(h("button",{class:"btn",text:"+ New template",onclick:function(){
    state.templates.push({id:uid("t"), name:"Untitled", subject:"", body:"Hi {{FirstName}},\n\n", customLine:""});
    save(); render();
  }}));
  v.appendChild(c2);

  v.appendChild(h("div",{class:"sectitle"},[h("h2",{text:"Stages"}),h("span",{class:"e",text:"rename or reorder — one per line"})]));
  var c3 = h("div",{class:"setcard"});
  c3.appendChild(field("Pipeline stages", state.stages.join("\n"), function(x){
    var arr = x.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    if (arr.length){ state.stages = arr; save(); render(); }
  }, {type:"textarea", wide:true}));
  v.appendChild(c3);

  v.appendChild(h("div",{class:"sectitle"},[h("h2",{text:"Data"}),h("span",{class:"e",text:"backup"})]));
  var c4 = h("div",{class:"setcard"});
  c4.appendChild(h("div",{class:"filters"},[
    h("button",{class:"btn",text:"Copy all data as JSON",onclick:function(){
      navigator.clipboard.writeText(JSON.stringify(state,null,1)).then(function(){ toast("Copied — paste somewhere safe"); });
    }}),
    h("button",{class:"btn",text:"Copy contacts as CSV",onclick:function(){
      var head = ["Name","Firm","Title","Group","Office","Connection","Email","Stage","Priority",
        "Initial sent","Last email","Last contact","Next action","Emails sent","Follow-ups","Replied","Referral","Notes"];
      var lines = [head.join(",")];
      state.contacts.forEach(function(c){
        var row = [fullName(c), firmName(c.firmId), c.title, c.group, c.office, c.connection, c.email,
          c.stage, "P"+c.priority, initialDate(c), lastEmailDate(c), c.lastContact, c.nextAction,
          emailCount(c), followUpCount(c), hasReplied(c)?"Yes":"No",
          c.referral?"Yes":"No", (c.notes||[]).map(function(n){return n.d+": "+n.t;}).join(" | ")];
        lines.push(row.map(function(x){ return '"' + String(x==null?"":x).replace(/"/g,'""') + '"'; }).join(","));
      });
      navigator.clipboard.writeText(lines.join("\n")).then(function(){ toast("CSV copied"); });
    }}),
    h("button",{class:"btn",text:"Copy outreach log as CSV",onclick:function(){
      var rows = [];
      state.contacts.forEach(function(c){
        emailsOfType(c, "all").forEach(function(e){
          rows.push([e.d, e.type === "initial" ? "Initial" : "Follow-up", fullName(c),
            firmName(c.firmId), c.stage, e.subject || "", e.est ? "estimated" : ""]);
        });
      });
      rows.sort(function(a,b){ return String(a[0]).localeCompare(String(b[0])); });
      var out = [["Date","Type","Name","Firm","Stage","Subject","Date source"].join(",")];
      rows.forEach(function(r){
        out.push(r.map(function(x){ return '"' + String(x==null?"":x).replace(/"/g,'""') + '"'; }).join(","));
      });
      navigator.clipboard.writeText(out.join("\n")).then(function(){
        toast(rows.length + " emails copied");
      });
    }})
  ]));
  c4.appendChild(h("div",{class:"hint",style:"color:var(--muted)",
    text:"Your records live in this page's own private store, not in the page file — republishing the app never touches them. Copy a JSON backup before any big cleanup."}));
  var imp = h("textarea",{placeholder:"Paste a JSON backup here\u2026"});
  imp.style.minHeight = "70px";
  c4.appendChild(h("div",{class:"f wide"},[h("label",{text:"Restore from backup"}), imp]));
  c4.appendChild(h("div",{class:"filters"},[
    h("button",{class:"btn danger",text:"Replace all data",onclick:function(){
      var parsed;
      try { parsed = JSON.parse(imp.value); }
      catch(e){ toast("That is not valid JSON"); return; }
      if (!parsed || !Array.isArray(parsed.contacts) || !Array.isArray(parsed.firms)){
        toast("Backup is missing its contacts or firms"); return;
      }
      if (!confirm("Replace all " + state.contacts.length + " contacts and " +
        state.firms.length + " firms with " + parsed.contacts.length + " contacts and " +
        parsed.firms.length + " firms? This cannot be undone.")) return;
      state.contacts = parsed.contacts;
      state.firms = parsed.firms;
      if (parsed.profile) state.profile = parsed.profile;
      if (parsed.settings) state.settings = parsed.settings;
      if (parsed.stages && parsed.stages.length) state.stages = parsed.stages;
      if (parsed.templates && parsed.templates.length) state.templates = parsed.templates;
      migrateState();
      written = {};
      save(); render(); toast("Restored " + parsed.contacts.length + " contacts");
    }})
  ]));
  v.appendChild(c4);
}

/* ---------- boot ---------- */
$("addbtn").addEventListener("click", addContactForm);
setFlag("loading…", "on");
migrateState();
document.addEventListener("keydown", function(e){
  if (e.key === "n" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); addContactForm(); }
});
safeRender();
boot().then(function(){ safeRender(); if (dirty) flush(); },
           function(){ ready = true; safeRender(); });
function safeRender(){
try { render(); } catch(err){
  $("view").appendChild(h("div",{class:"empty",text:"Something broke while rendering: " + (err && err.message)}));
  if (window.console) console.error(err);
}
}
})();
</script>
