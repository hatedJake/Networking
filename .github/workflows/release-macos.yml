name: Build macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (default: v<package.json version>-build.<run number>)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: electron-builder (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./package.json').version")-build.${RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Build .dmg (arm64 + x64)
        # Unsigned/ad-hoc build: there are no Developer ID certificates in this
        # repo, so tell electron-builder not to go looking for one.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --mac dmg --publish never

      - name: List artifacts
        run: ls -lh dist/*.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Coverage-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$TAG"
          prerelease=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PRERELEASE" = "true" ]; then
            prerelease="--prerelease"
          fi

          cat > notes.md <<'NOTES'
          ## Install

          1. Download the `.dmg` for your Mac below —
             **`-arm64`** for Apple Silicon (M1 and later), **`-x64`** for Intel.
          2. Open the `.dmg` and drag **Coverage** into Applications.
          3. The app is **not code-signed**, so the first launch needs one extra step:
             right-click (or Control-click) the app in Applications, choose **Open**,
             then confirm **Open** in the dialog. macOS remembers the choice.

          If macOS says the app "is damaged and can't be opened", it is the download
          quarantine flag rather than a broken file. Clear it with:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Coverage.app
          ```

          Your data lives in the app's local storage on your own machine; nothing is
          uploaded anywhere.
          NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg \
              --title "Coverage $tag" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              $prerelease
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag"
