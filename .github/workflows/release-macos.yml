name: Build macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (default: v<package.json version>-build.<run number>)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: electron-builder (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./package.json').version")-build.${RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Build .dmg (arm64 + x64)
        # Unsigned/ad-hoc build: there are no Developer ID certificates in this
        # repo, so tell electron-builder not to go looking for one.
        #
        # One architecture per invocation, on purpose. Naming a target on the
        # command line ("--mac dmg") overrides the whole mac.target block in
        # package.json including its arch list, so a bare "--mac dmg" silently
        # built only the runner's own architecture — which is why every release
        # before this contained an arm64 .dmg and nothing else while the notes
        # told Intel users to download an -x64 file that was never produced.
        # Passing --arm64 --x64 together fixes that but has both disk images
        # mounted at once, and they race on detach:
        #   ⨯ unable to execute hdiutil args=["detach","-quiet","/dev/disk4"]
        # Building them one at a time, and moving each result out of dist/
        # before the next starts, means only one volume is ever mounted.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          mkdir -p out
          for arch in arm64 x64; do
            ok=""
            for attempt in 1 2 3; do
              if npx --no-install electron-builder --mac dmg --"$arch" --publish never; then
                ok=1
                break
              fi
              echo "::warning::electron-builder failed for $arch (attempt $attempt of 3)"
              hdiutil detach -force /Volumes/Coverage* 2>/dev/null || true
              sleep 15
            done
            if [ -z "$ok" ]; then
              echo "::error::Could not build the $arch .dmg after 3 attempts."
              exit 1
            fi
            mv dist/*-"$arch".dmg out/
          done
          ls -lh out/*.dmg

      - name: List artifacts
        run: |
          ls -lh out/*.dmg
          # Fail loudly rather than publishing a half-built release whose notes
          # advertise a download that is not attached to it.
          for arch in arm64 x64; do
            if ! ls out/*-"$arch".dmg >/dev/null 2>&1; then
              echo "::error::No $arch .dmg was produced."
              exit 1
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Coverage-dmg
          path: out/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="$TAG"
          prerelease=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PRERELEASE" = "true" ]; then
            prerelease="--prerelease"
          fi

          cat > notes.md <<'NOTES'
          ## Install

          1. Download the `.dmg` for your Mac below —
             **`-arm64`** for Apple Silicon (M1 and later), **`-x64`** for Intel.
          2. Open the `.dmg` and drag **Coverage** into Applications.
          3. The app is **not code-signed**, so the first launch needs one extra step:
             right-click (or Control-click) the app in Applications, choose **Open**,
             then confirm **Open** in the dialog. macOS remembers the choice.

          If macOS says the app "is damaged and can't be opened", it is the download
          quarantine flag rather than a broken file. Clear it with:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Coverage.app
          ```

          Your data lives in the app's local storage on your own machine; nothing is
          uploaded anywhere.
          NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.dmg --clobber
          else
            gh release create "$tag" out/*.dmg \
              --title "Coverage $tag" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              $prerelease
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag"
